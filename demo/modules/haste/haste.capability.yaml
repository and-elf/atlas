capability:
  name: haste
depends_on: [entity, movement]

properties:
  HasteSource:
    range: int32
    multiplier: float
  CastSpeed:
    composition: Multiplicative
    base: float

requests:
  ActivateHaste:
    source: EntityRef
    range: int32
    multiplier: float

  RefreshHasteEffect:
    source: EntityRef
    target: EntityRef
