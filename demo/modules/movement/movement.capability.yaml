capability:
  name: movement
depends_on: [entity]

properties:
  Position:
    x: float
    y: float
  MovementSpeed:
    composition: Multiplicative
    base: float
  PositionChanged:
    trigger: true
    new_x: float
    new_y: float

requests:
  Move:
    target: EntityRef
    direction_x: float
    direction_y: float
    delta_ticks: uint64
