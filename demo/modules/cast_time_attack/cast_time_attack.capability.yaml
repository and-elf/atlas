capability:
  name: cast_time_attack
depends_on: [entity, attack_resolution, movement, interruption]

properties:
  CastTimeAttack:
    requires_stationary: bool
    target: EntityRef
    obstacle: EntityRef
    min_range: int32
    max_range: int32
    damage: int32
    cast_time_ticks: uint64
    remaining_ticks: uint64

requests:
  BeginCast:
    caster: EntityRef
    target: EntityRef
    obstacle: EntityRef
    min_range: int32
    max_range: int32
    damage: int32
    cast_time_ticks: uint64
    requires_stationary: bool

  AdvanceCast:
    caster: EntityRef
    delta_ticks: uint64

events:
  CastLanded:
    caster: EntityRef
    target: EntityRef
    damage: int32
