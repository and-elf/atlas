name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref so pushes to an open PR don't
# queue up redundant, already-stale jobs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: |
          files=$(git ls-files '*.cpp' '*.hpp' '*.cc' '*.h')
          if [ -n "$files" ]; then
            clang-format --dry-run --Werror $files
          fi

  static-analysis:
    name: clang-tidy
    runs-on: ubuntu-latest
    needs: format
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history needed to diff against the base ref below — only
          # files that actually changed get clang-tidy'd, matching
          # .githooks/pre-push's local scoping (see
          # cmake/scripts/clang-tidy-changed-files.sh).
          fetch-depth: 0
      - uses: seanmiddleditch/gha-setup-ninja@v4
      - name: Install SDL3 build dependencies (libraries/atlas-render/README.md's build-dependencies list)
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxext-dev libxcursor-dev libxi-dev libxfixes-dev \
            libxrandr-dev libxss-dev libxtst-dev
      - name: Configure (clang; compile_commands.json only — clang-tidy itself runs below, scoped to changed files)
        # ATLAS_RENDER_BACKEND=SDL3/ATLAS_INPUT_BACKEND=SDL3 so files only
        # compiled under those backends (e.g. sdl3_frame_backend.cpp, issue
        # #151; sdl3_raw_signal_source.cpp, issue #68) get real compile
        # flags in compile_commands.json instead of clang-tidy falling back
        # to guessed ones when it can't find a matching entry - the
        # build-and-test matrix below is unaffected and stays on the
        # default NULL backend.
        run: >
          cmake --preset clang-tidy -DATLAS_ENABLE_CLANG_TIDY=OFF -DATLAS_RENDER_BACKEND=SDL3
          -DATLAS_INPUT_BACKEND=SDL3
      - name: Build
        run: cmake --build --preset clang-tidy
      - name: clang-tidy (changed files only)
        run: |
          zero_sha="0000000000000000000000000000000000000000"
          empty_tree="4b825dc642cb6eb9a060e54bf8d69288fbee4904"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          else
            base_sha="${{ github.event.before }}"
            if [ -z "${base_sha}" ] || [ "${base_sha}" = "${zero_sha}" ]; then
              base_sha="${empty_tree}"
            fi
          fi
          ./cmake/scripts/clang-tidy-changed-files.sh build/clang-tidy "${base_sha}" "${{ github.sha }}"

  # Primary target platform (see CLAUDE.md / org software-design
  # conventions): the sanitized/coverage/tidy jobs above and below run
  # here. macOS and Windows below only prove the build itself is portable.
  build-and-test:
    name: Build & test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    needs: format
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc-debug-sanitized
            os: ubuntu-latest
            preset: debug
            cxx: g++
          - name: linux-clang-debug-sanitized
            os: ubuntu-latest
            preset: debug
            cxx: clang++
          - name: linux-gcc-release
            os: ubuntu-latest
            preset: release
            cxx: g++
          - name: macos-clang-release
            os: macos-latest
            preset: release
            cxx: clang++
          - name: windows-msvc-release
            os: windows-latest
            preset: release
            cxx: ""
          # issue #161: the only leg that actually builds/runs
          # ATLAS_RENDER_BACKEND=SDL3 end to end (every other leg above stays
          # on the default NULL backend, unaffected). Mirrors
          # linux-gcc-debug-sanitized's own compiler/preset choice
          # deliberately, not linux-clang-debug-sanitized's: every local
          # verification of this backend (issue #155's pixel-correctness
          # test, the lsan_suppressions.txt entries, the whole
          # lavapipe/offscreen-driver mechanism) was done without an explicit
          # CXX override, which this project's own dev sandbox resolves to
          # g++ - matching that exactly here rather than assuming an
          # unverified clang+ASan combination behaves identically against
          # the same vendored DXC binary/lavapipe leak signatures.
          - name: linux-gcc-debug-sanitized-sdl3
            os: ubuntu-latest
            preset: debug
            cxx: g++
            render_backend: SDL3
            # issue #68: also builds/runs ATLAS_INPUT_BACKEND=SDL3 end to
            # end in the same leg as ATLAS_RENDER_BACKEND=SDL3 - both
            # backends coexisting in the same process/build is exactly the
            # "SDL3 for both, no forced coupling either way" claim this
            # library's own README makes; verifying it for real in CI beats
            # only ever asserting it locally. Sdl3RawSignalSource needs no
            # extra system packages beyond what SDL3's own Linux build
            # already requires (no GPU/Vulkan dependency at all, unlike the
            # render backend) - one apt-get install list below still covers
            # both.
            input_backend: SDL3
    steps:
      - uses: actions/checkout@v4
      - uses: seanmiddleditch/gha-setup-ninja@v4
      # Ninja + cl.exe (unlike the Visual Studio generator) needs
      # INCLUDE/LIB/PATH from vcvarsall on PATH itself; without this the
      # configure step below can't find a working MSVC toolchain.
      - if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1
      # issue #161: SDL3's own Linux build dependencies (X11 dev headers,
      # already documented in libraries/atlas-render/README.md's "Scoping
      # decisions" as needed since issue #151) plus mesa-vulkan-drivers -
      # Mesa's lavapipe/llvmpipe software Vulkan ICD, the real, working
      # SDL_GPU backend this leg's tests need to actually run instead of
      # skipping (issue #155's own verified mechanism: lavapipe alone is not
      # sufficient without also switching SDL_HINT_VIDEO_DRIVER to
      # "offscreen", already done in every fixture's own test code, not a
      # CI-side concern).
      - if: matrix.render_backend == 'SDL3' || matrix.input_backend == 'SDL3'
        name: Install SDL3 + lavapipe build/runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxext-dev libxcursor-dev libxi-dev libxfixes-dev \
            libxrandr-dev libxss-dev libxtst-dev mesa-vulkan-drivers
      - name: Configure
        shell: bash
        run: |
          if [ -n "${{ matrix.cxx }}" ]; then
            export CXX="${{ matrix.cxx }}"
          fi
          extra_args=()
          if [ -n "${{ matrix.render_backend }}" ]; then
            extra_args+=("-DATLAS_RENDER_BACKEND=${{ matrix.render_backend }}")
          fi
          if [ -n "${{ matrix.input_backend }}" ]; then
            extra_args+=("-DATLAS_INPUT_BACKEND=${{ matrix.input_backend }}")
          fi
          cmake --preset ${{ matrix.preset }} "${extra_args[@]}"
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  coverage:
    # 75% mirrors cmake/CodeCoverage.cmake's ATLAS_COVERAGE_THRESHOLD default
    # — kept in sync manually since a job-level `name:` can't reference the
    # `env` context (only step-level fields can), and GitHub Actions can't
    # read a CMake cache variable directly either way.
    name: Coverage gate (75%)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: seanmiddleditch/gha-setup-ninja@v4
      - name: Install gcovr
        run: sudo apt-get update && sudo apt-get install -y gcovr
      - name: Configure
        run: cmake --preset coverage
      - name: Build
        run: cmake --build --preset coverage
      - name: Test
        run: ctest --preset coverage
      - name: Generate coverage report and enforce gate
        run: cmake --build build/coverage --target coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/coverage/coverage/
          retention-days: 30
