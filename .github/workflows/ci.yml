name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref so pushes to an open PR don't
# queue up redundant, already-stale jobs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Mirrors cmake/CodeCoverage.cmake's ATLAS_COVERAGE_THRESHOLD default —
  # kept in sync manually since GitHub Actions can't read a CMake cache
  # variable directly.
  COVERAGE_THRESHOLD: 75

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: |
          files=$(git ls-files '*.cpp' '*.hpp' '*.cc' '*.h')
          if [ -n "$files" ]; then
            clang-format --dry-run --Werror $files
          fi

  static-analysis:
    name: clang-tidy
    runs-on: ubuntu-latest
    needs: format
    steps:
      - uses: actions/checkout@v4
      - uses: seanmiddleditch/gha-setup-ninja@v4
      - name: Configure (clang, clang-tidy enabled)
        run: cmake --preset clang-tidy
      - name: Build (clang-tidy runs per translation unit)
        run: cmake --build --preset clang-tidy

  # Primary target platform (see CLAUDE.md / org software-design
  # conventions): the sanitized/coverage/tidy jobs above and below run
  # here. macOS and Windows below only prove the build itself is portable.
  build-and-test:
    name: Build & test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    needs: format
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc-debug-sanitized
            os: ubuntu-latest
            preset: debug
            cxx: g++
          - name: linux-clang-debug-sanitized
            os: ubuntu-latest
            preset: debug
            cxx: clang++
          - name: linux-gcc-release
            os: ubuntu-latest
            preset: release
            cxx: g++
          - name: macos-clang-release
            os: macos-latest
            preset: release
            cxx: clang++
          - name: windows-msvc-release
            os: windows-latest
            preset: release
            cxx: ""
    steps:
      - uses: actions/checkout@v4
      - uses: seanmiddleditch/gha-setup-ninja@v4
      # Ninja + cl.exe (unlike the Visual Studio generator) needs
      # INCLUDE/LIB/PATH from vcvarsall on PATH itself; without this the
      # configure step below can't find a working MSVC toolchain.
      - if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        shell: bash
        run: |
          if [ -n "${{ matrix.cxx }}" ]; then
            export CXX="${{ matrix.cxx }}"
          fi
          cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  coverage:
    name: Coverage gate (${{ env.COVERAGE_THRESHOLD }}%)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: seanmiddleditch/gha-setup-ninja@v4
      - name: Install gcovr
        run: sudo apt-get update && sudo apt-get install -y gcovr
      - name: Configure
        run: cmake --preset coverage
      - name: Build
        run: cmake --build --preset coverage
      - name: Test
        run: ctest --preset coverage
      - name: Generate coverage report and enforce gate
        run: cmake --build build/coverage --target coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/coverage/coverage/
          retention-days: 30
